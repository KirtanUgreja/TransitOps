services:
  postgres:
    image: postgres:16-alpine
    container_name: transitops-db
    environment:
      POSTGRES_DB: transitops
      POSTGRES_USER: transitops
      POSTGRES_PASSWORD: transitops
    ports:
      - "5432:5432"
    volumes:
      - transitops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transitops -d transitops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  transitops_pgdata:
